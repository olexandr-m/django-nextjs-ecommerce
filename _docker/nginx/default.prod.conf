upstream backend {
    server backend:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # Starter placeholder: replace NEW_PROJECT_DOMAIN with the real production domain.
    listen 80;
    server_name NEW_PROJECT_DOMAIN www.NEW_PROJECT_DOMAIN;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Starter placeholder: replace NEW_PROJECT_DOMAIN and the certificate path
    # domain with the real production domain after the first certificate is issued.
    listen 443 ssl;
    http2 on;
    server_name NEW_PROJECT_DOMAIN www.NEW_PROJECT_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/NEW_PROJECT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/NEW_PROJECT_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /staticfiles/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /mediafiles/ {
        alias /app/mediafiles/;
        expires 7d;
        try_files $uri =404;
    }

    location ~ ^/(api|admin|redoc|schema)/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
