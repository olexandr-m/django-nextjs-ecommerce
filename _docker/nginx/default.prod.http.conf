upstream backend {
    server backend:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # Starter placeholder: replace NEW_PROJECT_DOMAIN with the real production
    # domain before issuing the first Let's Encrypt certificate.
    listen 80;
    server_name NEW_PROJECT_DOMAIN www.NEW_PROJECT_DOMAIN;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /staticfiles/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /mediafiles/ {
        alias /app/mediafiles/;
        expires 7d;
        try_files $uri =404;
    }

    location ~ ^/(api|admin|redoc|schema)/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
